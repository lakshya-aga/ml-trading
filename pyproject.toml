[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afml-india"
version = "0.1.0"
description = "Advances in Financial Machine Learning (Lopez de Prado) applied to Indian equity markets (NSE/BSE)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ml-trading contributors" }]
keywords = ["finance", "machine-learning", "afml", "nse", "bse", "india", "quant"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "numba>=0.59",          # fin-kit's sequential bootstrap requires it
    "PyYAML>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
data = ["yfinance>=0.2.40", "pyarrow>=14.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
deep = ["torch>=2.0"]
notebooks = ["jupyterlab>=4.0", "nbformat>=5.9", "nbclient>=0.9", "matplotlib>=3.7"]

[project.scripts]
afml-india = "afml_india.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: fits a model; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
